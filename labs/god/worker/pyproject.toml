[project]
name = "god-worker"
version = "0.1.0"
description = "Desktop input worker for the God Mac operator"
requires-python = ">=3.10"
dependencies = [
  "openai>=2,<3",
  "pillow>=10",
  "pyautogui>=0.9.54",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/god_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
